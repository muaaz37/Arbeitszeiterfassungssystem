name: Fehlerbericht
description: Reproduzierbaren Fehler erfassen
title: "fix: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Fehlerbeschreibung
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Umgebung und Zusatzinformationen
      description: Keine Passwörter, Tokens oder personenbezogenen Echtdaten eintragen

spring.application.name=backend
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/arbeitszeiterfassung}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:arbeitszeiterfassung-api}

spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5433}/${APP_DB_NAME:arbeitszeiterfassung}
spring.datasource.username=${APP_DB_USER:arbeitszeiterfassung}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
